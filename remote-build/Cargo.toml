[package]
name = "remote-build"
version = "0.1.0"
edition = "2021"
description = "Remote Build System — Windows 桌面构建部署工具（P0）"

[package.metadata.bundle]
resources = ["tools/", "config/"]

[dependencies]
# wgpu 渲染后端：glow 在 RDP/远程会话下只有 GDI OpenGL 1.1，无法满足 GL2 要求；
# wgpu 走 DX12/Vulkan，远程桌面可用
eframe = { version = "0.27", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
] }
egui = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
dirs = "5.0"
whoami = "1.4"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"                    # 工具校验和
keyring = "2.0"                  # Windows Credential Manager（P1 密码存储）
winapi = { version = "0.3", features = ["shellapi", "winuser", "wincon"] }  # 快捷方式/通知（P2）
rfd = "0.13"                     # 原生文件/文件夹选择对话框（项目目录浏览）
zip = { version = "2", default-features = false, features = ["deflate"] }  # pack 步骤内置打包
glob = "0.3"                     # pack 源通配匹配（如 target/*.jar）
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio"], optional = true }  # P1 运行历史

[features]
default = []
sqlite = ["dep:sqlx"]

[profile.dev]
opt-level = 1
